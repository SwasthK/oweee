services:
  db:
    image: postgres:16-alpine
    container_name: oweee-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: oweee
    ports:
      - "5432:5432"
    volumes:
      - oweee_pgdata:/var/lib/postgresql/data

volumes:
  oweee_pgdata:
